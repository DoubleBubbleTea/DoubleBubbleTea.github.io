<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Lịch sử đặt phòng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./layout.css">
    <script src="./student_header.js"></script>
    <script defer src="https://app.fastbots.ai/embed.js" data-bot-id="cmj49xvd200slpa1pjdwephas"></script>

    <style>
        .content {
            flex: 1;
            padding: 40px 80px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .action-bar {
            margin-bottom: 10px;
        }

        select {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }

        .btn-cancel-booking {
            padding: 6px 12px;
            min-width: 110px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            color: white;
        }

        .cancel {
            background: #1E8B38;
            cursor: pointer;
        }

        .disabled {
            background: #DC3546;
            cursor: not-allowed;
        }

        .canceled {
            background: #FEBF07;
            color: black;
            cursor: not-allowed;
            opacity: 0.95;
        }

        .btn-cancel-booking.canceled:hover {
            background: #FEBF07 !important;
            /* không đổi */
            transform: none !important;
        }

        /* BUTTON KHÔNG THỂ HỦY */
        .btn-cancel-booking.disabled {
            background: #DC3546;
            cursor: not-allowed;
            opacity: 0.9;
        }

        .btn-cancel-booking.disabled:hover {
            background: #DC3546 !important;
            transform: none !important;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-title">LỊCH SỬ ĐẶT PHÒNG</div>
        <div class="header-right">

            <div class="icon notification-icon" onclick="toggleNotification()">
                <img src="../img/notification_new.png" class="icon-img">
                <div id="notif-count" class="notif-count" style="display:none;">0</div>
            </div>

            <div class="icon logout-icon" onclick="openLogoutModal()">
                <img src="../img/logout_new.png" class="icon-img">
            </div>

            <div id="header-user">Đang tải...</div>

            <div id="notif-dropdown" class="notif-dropdown">
                <div class="notif-title">Thông báo</div>
                <div id="notif-list" class="notif-list">Không có thông báo!</div>
            </div>
        </div>
    </div>
    <!-- ================= REMINDER BOX ================= -->
    <div id="bookingReminder" class="booking-reminder" style="display:none;">
        <div class="reminder-icon">⏰</div>
        <div class="reminder-content">
            <div class="reminder-title">
                Sắp đến giờ sử dụng phòng
            </div>
            <div class="reminder-text" id="reminderText">
                —
            </div>
        </div>
    </div>
    <!-- MAIN -->
    <div class="main">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="avatar-box">
                <img id="student-avatar" src="../img/logo.png" alt="avatar">
                <div class="avatar-name" id="avatar-fullname">—</div>
            </div>
            <h3>Danh sách</h3>
            <a href="./information.html">Thông tin cá nhân</a>
            <a href="#" onclick="checkTrustBeforeBooking()">Đặt phòng</a>
            <a href="./booking_history.html" class="active">Lịch sử đặt phòng</a>
            <a href="./checkin_room.html">Check-in phòng</a>
            <a href="./checkin_seat.html">Check-in chỗ ngồi</a>
            <a href="#">Sự kiện của tôi</a>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <h2>Lịch sử đặt phòng của bạn</h2>

            <!-- FILTER -->
            <div class="action-bar">
                <select id="room-filter" onchange="filterByRoomType()">
                    <option value="all">Hiển thị tất cả</option>
                    <option value="I">Phòng đơn</option>
                    <option value="G">Phòng nhóm</option>
                </select>
            </div>

            <table>
                <thead id="historyHead"></thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="13" style="text-align:center;">Đang tải...</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

    <!-- MODAL XÁC NHẬN HỦY -->
    <div id="cancel-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Bạn muốn hủy đăng ký?</h3>
            <p id="cancel-text"></p>

            <div class="modal-buttons">
                <button class="btn-confirm" onclick="confirmCancelBooking()">Hủy đăng ký</button>
                <button class="btn-cancel" onclick="closeCancelModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- LOGOUT MODAL -->
    <div id="logout-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Bạn muốn đăng xuất?</h3>
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="logout()">Đăng xuất</button>
                <button class="btn-cancel" onclick="closeLogoutModal()">Hủy</button>
            </div>
        </div>
    </div>
    <!-- ==================== POPUP ==================== -->
    <div id="popupModal" class="modal-overlay">
        <div class="modal-box small-popup">
            <div class="modal-icon" style="font-size:40px; margin-bottom:10px; color: red;">X</div>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button class="btn-primary" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let allBookings = [];
        async function autoUpdateBookingStatus(data) {
            const now = new Date();

            for (const b of data) {
                if (!b.starttime || !b.endtime) continue;
                if (b.booking_status === "Hủy") continue;

                const start = new Date(b.starttime);
                const end = new Date(b.endtime);

                let newStatus = b.booking_status;

                if (now < start) {
                    newStatus = "Đang giữ chỗ";
                } else if (now >= start && now <= end) {
                    newStatus = "Đang sử dụng";
                } else if (now > end) {
                    newStatus = "Đã sử dụng";
                }

                if (newStatus !== b.booking_status) {
                    await db
                        .from("booking")
                        .update({ booking_status: newStatus })
                        .eq("bookingid", b.bookingid);

                    // cập nhật local data để render đúng
                    b.booking_status = newStatus;
                }
            }
        }
        /* ================= LOAD DATA ================= */
        async function loadBookingHistory() {
            const studentId = localStorage.getItem("studentid");
            const body = document.getElementById("historyBody");

            if (!studentId) {
                body.innerHTML = `<tr><td colspan="13">Không tìm thấy studentid</td></tr>`;
                return;
            }

            const { data, error } = await db
                .from("booking")
                .select("*")
                .eq("studentid", studentId)
                .order("starttime", { ascending: false });

            if (error) {
                body.innerHTML = `<tr><td colspan="13">Lỗi tải dữ liệu</td></tr>`;
                return;
            }

            allBookings = data || [];
            await autoUpdateBookingStatus(allBookings);
            filterByRoomType();
        }

        /* ================= FILTER ================= */
        function filterByRoomType() {
            const type = document.getElementById("room-filter").value;
            let filtered = allBookings;

            if (type === "I") {
                filtered = allBookings.filter(b => b.roomid?.startsWith("I"));
            } else if (type === "G") {
                filtered = allBookings.filter(b => b.roomid?.startsWith("G"));
            }

            renderHeader(type);
            renderRows(filtered, type);
        }

        /* ================= HEADER ================= */
        function renderHeader(type) {
            const head = document.getElementById("historyHead");

            if (type === "I") {
                head.innerHTML = `
                <tr>
                    <th>Mã đặt</th>
                    <th>MSSV</th>
                    <th>Mã ghế</th>
                    <th>Trạng thái</th>
                    <th>Ngày đặt</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Hủy đăng ký</th>
                </tr>`;
            } else if (type === "G") {
                head.innerHTML = `
                <tr>
                    <th>Mã đặt</th>
                    <th>MSSV</th>
                    <th>Mã phòng</th>
                    <th>Cơ sở vật chất</th>
                    <th>Trạng thái</th>
                    <th>Ngày đặt</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Hủy đăng ký</th>
                </tr>`;
            } else {
                head.innerHTML = `
                <tr>
                    <th>Mã đặt</th>
                    <th>MSSV</th>
                    <th>Mã phòng</th>
                    <th>Mã ghế</th>
                    <th>Tiện ích</th>
                    <th>Số lượng</th>
                    <th>Mục đích</th>
                    <th>Trạng thái</th>
                    <th>Ngày đặt</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Hủy</th>
                </tr>`;
            }
        }

        /* ================= ROWS ================= */
        function renderRows(data, type) {
            const body = document.getElementById("historyBody");
            body.innerHTML = "";

            if (!data.length) {
                body.innerHTML = `<tr><td colspan="13">Không có dữ liệu</td></tr>`;
                return;
            }

            const now = new Date();

            data.forEach(b => {
                const start = new Date(b.starttime);
                const end = new Date(b.endtime);

                const startFull = start.toLocaleString("vi-VN");
                const endFull = end.toLocaleString("vi-VN");

                const bookingDate = startFull.split(" ")[1];
                const startTime = startFull.split(" ")[0];
                const endTime = endFull.split(" ")[0];

                /* ===== ACTION BUTTON (KHÔI PHỤC ĐẦY ĐỦ) ===== */
                const allowCancel = now < start && b.booking_status !== "Đã sử dụng";
                let actionButton = "";

                if (b.booking_status === "Hủy") {
                    actionButton = `<button class="btn-cancel-booking canceled" disabled>Đã hủy</button>`;
                } else if (!allowCancel) {
                    actionButton = `<button class="btn-cancel-booking disabled" disabled>Không thể hủy</button>`;
                } else {
                    actionButton = `
                <button class="btn-cancel-booking cancel"
                        onclick="openCancelModal(${b.bookingid})">
                    Hủy
                </button>`;
                }

                let row = "";

                /* ===== PHÒNG ĐƠN ===== */
                if (type === "I") {
                    row = `
                <tr>
                    <td>${b.bookingid}</td>
                    <td>${b.studentid}</td>
                    <td>${b.seatid || "—"}</td>
                    <td><strong>${b.booking_status}</strong></td>
                    <td>${bookingDate}</td>
                    <td>${startTime}</td>
                    <td>${endTime}</td>
                    <td>${actionButton}</td>
                </tr>`;
                }

                /* ===== PHÒNG NHÓM ===== */
                else if (type === "G") {
                    row = `
                <tr>
                    <td>${b.bookingid}</td>
                    <td>${b.studentid}</td>
                    <td>${b.roomid}</td>
                    <td>${b.facilities || "—"}</td>
                    <td><strong>${b.booking_status}</strong></td>
                    <td>${bookingDate}</td>
                    <td>${startTime}</td>
                    <td>${endTime}</td>
                    <td>${actionButton}</td>
                </tr>`;
                }

                /* ===== HIỂN THỊ TẤT CẢ ===== */
                else {
                    row = `
                <tr>
                    <td>${b.bookingid}</td>
                    <td>${b.studentid}</td>
                    <td>${b.roomid || "—"}</td>
                    <td>${b.seatid || "—"}</td>
                    <td>${b.facilities || "—"}</td>
                    <td>${b.numbermember ?? "—"}</td>
                    <td>${b.purpose || "—"}</td>
                    <td><strong>${b.booking_status}</strong></td>
                    <td>${bookingDate}</td>
                    <td>${startTime}</td>
                    <td>${endTime}</td>
                    <td>${actionButton}</td>
                </tr>`;
                }

                body.insertAdjacentHTML("beforeend", row);
            });
        }
        /* ==================== OPEN/CLOSE CANCEL MODAL ==================== */
        function openCancelModal(bookingId) {
            bookingToCancel = bookingId;
            document.getElementById("cancel-modal").style.display = "flex";
        }

        function closeCancelModal() {
            bookingToCancel = null;
            document.getElementById("cancel-modal").style.display = "none";
        }

        /* ==================== CONFIRM CANCEL ==================== */
        async function confirmCancelBooking() {
            if (!bookingToCancel) return;

            await db
                .from("booking")
                .update({ booking_status: "Hủy" })
                .eq("bookingid", bookingToCancel);

            closeCancelModal();
            loadBookingHistory();
        }

        /* INIT */
        loadStudentName();
        loadBookingHistory();
    </script>

</body>

</html>
