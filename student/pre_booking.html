<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>USSH - Chọn loại đặt phòng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER TRANG CHỦ + USER NAME */
        .header {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            box-sizing: border-box;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        #header-user {
            font-size: 16px;
            color: #111827;
            font-weight: bold;
        }

        /* MAIN LAYOUT: SIDEBAR + CONTENT */
        .main {
            display: flex;
            flex: 1;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            padding: 8px 0;
            color: #111827;
            text-decoration: none;
            cursor: pointer;
        }

        .sidebar a:hover {
            font-weight: bold;
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 40px 80px;
            box-sizing: border-box;
            text-align: center;
        }

        .choice-wrapper {
            display: flex;
            justify-content: center;
            gap: 120px;
            margin-top: 40px;
        }

        .choice-box {
            width: 260px;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s;
            box-sizing: border-box;
        }

        .choice-box:hover {
            background: #f0f4ff;
            transform: scale(1.03);
        }

        img {
            width: 75%;
            pointer-events: none;
        }

        h2 {
            font-size: 20px;
            color: #1f2937;
        }

        p {
            font-size: 14px;
            color: #6b7280;
            margin-top: -5px;
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->
    <div class="header">
        <div class="header-title">Đặt phòng</div>
        <div id="header-user">Đang tải...</div>
    </div>

    <!-- ================= MAIN ================= -->
    <div class="main">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>Danh sách</h3>
            <a href="./information.html">Thông tin cá nhân</a>
            <a href="./pre_booking.html">Đặt phòng</a>
            <a href="./booking_history.html">Lịch sử đặt phòng</a>
            <a href="#">Sự kiện của tôi</a>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <div class="choice-wrapper">

                <!-- BOOK SINGLE -->
                <div class="choice-box" onclick="location.href='./bookingtest.html'">
                    <img src="../img/single_study.png" alt="Booking cá nhân">
                    <h2>Đặt phòng cá nhân</h2>
                    <p>Nhấn để đặt phòng tự học cá nhân.</p>
                </div>

                <!-- BOOK GROUP -->
                <div class="choice-box" onclick="location.href='./booking_GR.html'">
                    <img src="../img/group_study.png" alt="Booking nhóm">
                    <h2>Đặt phòng nhóm</h2>
                    <p>Nhấn để đặt phòng học nhóm.</p>
                </div>

            </div>
        </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Tạo client Supabase
        const db = supabase.createClient(
            "https://oxaimnemcnqudtdguoyk.supabase.co",
            "sb_publishable_6p-lVAZg_ATPz1a1cDjlOg_9vIcR42c"
        );

        // Load tên sinh viên
        async function loadStudentName() {
            const studentId = localStorage.getItem("studentid");
            console.log("studentId:", studentId);

            if (!studentId) {
                document.getElementById("header-user").innerText = "Chưa đăng nhập";
                return;
            }

            const { data, error } = await db
                .from("student")
                .select("fullname")
                .eq("studentid", studentId)
                .single();

            if (error || !data) {
                console.log(error);
                document.getElementById("header-user").innerText = "Không tìm thấy sinh viên";
                return;
            }

            document.getElementById("header-user").innerText = `Xin chào, ${data.fullname}`;
        }

        loadStudentName();
    </script>

</body>

</html>
