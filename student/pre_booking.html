<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chọn loại đặt phòng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS chung -->
    <link rel="stylesheet" href="./layout.css">

    <style>
        /* CSS RIÊNG CỦA TRANG NÀY */
        .content {
            flex: 1;
            padding: 40px 80px;
            box-sizing: border-box;
            text-align: center;
        }

        .choice-wrapper {
            display: flex;
            justify-content: center;
            gap: 120px;
            margin-top: 40px;
        }

        .choice-box {
            width: 260px;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s;
            box-sizing: border-box;
        }

        .choice-box:hover {
            background: #f0f4ff;
            transform: scale(1.03);
        }

        img {
            width: 75%;
            pointer-events: none;
        }

        h2 {
            font-size: 20px;
            color: #1f2937;
        }

        p {
            font-size: 14px;
            color: #6b7280;
            margin-top: -5px;
        }

        .divider {
            width: 1px;
            height: 400px;
            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0) 0%,
                    rgba(0, 0, 0, 0.15) 50%,
                    rgba(0, 0, 0, 0) 100%);
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-title">ĐẶT PHÒNG</div>
        <div class="header-right">
            <!-- ICON NOTIFICATION -->
            <div class="icon notification-icon" onclick="toggleNotification()">
                <img src="../img/notification_new.png" class="icon-img">
                <div id="notif-count" class="notif-count" style="display:none;">0</div>
            </div>

            <!-- ICON LOGOUT -->
            <div class="icon logout-icon" onclick="openLogoutModal()">
                <img src="../img/logout_new.png" class="icon-img">
            </div>

            <div id="header-user">Đang tải...</div>

            <!-- DROPDOWN NOTIFICATION -->
            <div id="notif-dropdown" class="notif-dropdown">
                <div class="notif-title">Thông báo</div>
                <div id="notif-list" class="notif-list">Không có thông báo!</div>
            </div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>Danh sách</h3>
            <a href="./information.html">Thông tin cá nhân</a>
            <a href="./pre_booking.html" class="active">Đặt phòng</a>
            <a href="./booking_history.html">Lịch sử đặt phòng</a>
            <a href="#">Sự kiện của tôi</a>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <div class="choice-wrapper">

                <div class="choice-box" onclick="location.href='./bookingtest.html'">
                    <img src="../img/single.png" alt="Booking cá nhân">
                    <h2>Đặt phòng cá nhân</h2>
                    <p>Nhấn để đặt phòng tự học cá nhân.</p>
                </div>
                <div class="divider"></div> <!-- VẠCH MỜ Ở GIỮA -->

                <div class="choice-box" onclick="location.href='./booking_GR.html'">
                    <img src="../img/group.jpg" alt="Booking nhóm">
                    <h2>Đặt phòng nhóm</h2>
                    <p>Nhấn để đặt phòng học nhóm.</p>
                </div>

            </div>
        </div>

    </div>
    <!-- LOGOUT MODAL -->
    <div id="logout-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Bạn muốn đăng xuất?</h3>
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="logout()">Đăng xuất</button>
                <button class="btn-cancel" onclick="closeLogoutModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JS load header -->
    <script src="./student_header.js"></script>

</body>

</html>
