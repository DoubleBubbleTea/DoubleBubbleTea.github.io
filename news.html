<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bảng tin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./student/student_header.js"></script>

    <!-- Layout chung -->
    <link rel="stylesheet" href="./student/layout.css">

    <style>
        /* ===== PAGE WRAPPER ===== */
        .content {
            padding: 40px 80px;
            background: #f9fafb;
        }

        /* ===== NEWS LAYOUT ===== */
        .news-top {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .news-main {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .news-main img {
            width: 100%;
            height: 360px;
            object-fit: cover;
        }

        .news-main .news-body {
            padding: 20px;
        }

        .news-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .news-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .news-card .news-body {
            padding: 14px 16px;
        }

        .news-body h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .news-body p {
            margin: 0;
            color: #555;
            font-size: 14px;
        }

        /* ===== LIST BELOW ===== */
        .news-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .btn-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: #275167;
            color: #ffffff;

            height: 40px;
            padding: 0 22px;
            min-width: 120px;

            border: none;
            border-radius: 999px;
            /* bo tròn đẹp */
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;

            cursor: pointer;
            text-decoration: none;

            box-shadow: 0 4px 10px rgba(39, 81, 103, 0.25);
            transition: all 0.25s ease;
        }

        /* Hover */
        .btn-login:hover {
            background: #1f4254;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(39, 81, 103, 0.35);
        }

        /* Click */
        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(39, 81, 103, 0.25);
        }
    </style>
</head>

<body>

    <!-- HEADER (CHỈ ĐĂNG NHẬP) -->
    <div class="header">
        <div class="header-title">BẢNG TIN</div>
        <div class="header-right">
            <a href="./index.html" class="btn-login">Đăng nhập</a>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- TOP SECTION -->
        <div class="news-top">
            <div id="news-main" class="news-main"></div>

            <div class="news-side">
                <div id="news-side-1"></div>
                <div id="news-side-2"></div>
            </div>
        </div>

        <!-- BELOW LIST -->
        <h2>Bản tin khác</h2>
        <div id="news-list" class="news-list"></div>

    </div>

    <!-- SUPABASE -->
    <script>
        function renderNews(item) {
            const img = `./img/${item.image_url}`;

            return `
                <img src="${img}">
                <div class="news-body">
                    <h3>${item.title}</h3>
                    <p>${item.summary || ""}</p>
                </div>
            `;
        }

        async function loadNews() {
            const { data } = await db
                .from("news")
                .select("*")
                .eq("is_active", "Có")
                .order("section_order");

            data.forEach(n => {
                if (n.section_order === 1) {
                    document.getElementById("news-main").innerHTML = renderNews(n);
                }
                else if (n.section_order === 2) {
                    document.getElementById("news-side-1").innerHTML =
                        `<div class="news-card">${renderNews(n)}</div>`;
                }
                else if (n.section_order === 3) {
                    document.getElementById("news-side-2").innerHTML =
                        `<div class="news-card">${renderNews(n)}</div>`;
                }
                else {
                    document.getElementById("news-list").innerHTML +=
                        `<div class="news-card">${renderNews(n)}</div>`;
                }
            });
        }

        loadNews();
    </script>

</body>

</html>
