<div id="logout-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>Bạn muốn đăng xuất?</h3>
        <div style="margin-top: 15px;">

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-title">Dashboard</div>

        <div class="header-right">

            <!-- NOTIFICATION ICON -->
            <div class="icon notification-icon" onclick="toggleNotification()">
                <img src="../img/notification_new.png" class="icon-img">
                <div id="notif-count" class="notif-count" style="display:none;">0</div>
            </div>

            <!-- LOGOUT ICON -->
            <div class="icon logout-icon" onclick="openLogoutModal()">
                <img src="../img/logout_new.png" class="icon-img">
            </div>

            <div id="header-user">Đang tải...</div>

            <!-- NOTIFICATION DROPDOWN -->
            <div id="notif-dropdown" class="notif-dropdown">
                <div class="notif-title">Thông báo</div>
                <div id="notif-list" class="notif-list">Không có thông báo!</div>
            </div>
        </div>
    </div>

    <div class="main">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">Logo</div>
            <div class="sidebar-title">Administrator</div>

            <a href="./dashboard.html">Thông tin cá nhân</a>
            <a href="./load_student.html">Danh sách sinh viên</a>
            <a href="./load_history.html">Lịch sử đặt phòng</a>
            <a href="./load_seat.html">Danh sách phòng</a>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <h2>Thông tin quản trị viên</h2>

            <div class="info-box">

                <!-- VIEW MODE -->
                <div id="view-mode">
                    <div class="info-item">
                        <label>Họ tên:</label>
                        <span id="view-fullname">...</span>
                    </div>

                    <div class="info-item">
                        <label>Email:</label>
                        <span id="view-email">...</span>
                    </div>

                    <div class="info-item">
                        <label>Vai trò:</label>
                        <span id="view-role">...</span>
                    </div>

                    <div class="info-item">
                        <label>Trạng thái:</label>
                        <span id="view-status">...</span>
                    </div>

                    <button class="btn-edit" onclick="enableEdit()">Sửa</button>
                </div>

                <!-- EDIT MODE -->
                <div id="edit-mode" style="display:none;">
                    <div class="info-item">
                        <label>Họ tên:</label>
                        <input id="edit-fullname" class="info-edit">
                    </div>

                    <div class="info-item">
                        <label>Email:</label>
                        <input id="edit-email" class="info-edit">
                    </div>

                    <div class="info-item">
                        <label>Vai trò:</label>
                        <input id="edit-role" class="info-edit">
                    </div>

                    <div class="info-item">
                        <label>Trạng thái:</label>
                        <input id="edit-status" class="info-edit">
                    </div>

                    <button class="btn-save" onclick="saveAdmin()">Lưu</button>
                    <button class="btn-cancel" onclick="cancelEdit()">Hủy</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- SUPABASE -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->

    <script>
        // const db = supabase.createClient(
        //     "https://oxaimnemcnqudtdguoyk.supabase.co",
        //     "sb_publishable_6p-lVAZg_ATPz1a1cDjlOg_9vIcR42c"
        // );

        function showModal(title, msg) {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-message").innerText = msg;
            document.getElementById("modal").style.display = "flex";
        }
        function closeModal() { document.getElementById("modal").style.display = "none"; }

        async function loadHeader() {
            const adminId = localStorage.getItem("adminid");
            const { data } = await db.from("admin").select("fullname").eq("adminid", adminId).single();

            document.getElementById("header-user").innerText =
                data ? `Xin chào, ${data.fullname}` : "Không tìm thấy admin";
        }

        async function loadAdminInfo() {
            const adminId = localStorage.getItem("adminid");

            const { data } = await db
                .from("admin")
                .select("*")
                .eq("adminid", adminId)
                .single();

            if (!data) return;

            document.getElementById("view-fullname").innerText = data.fullname;
            document.getElementById("view-email").innerText = data.email;
            document.getElementById("view-role").innerText = data.role;
            document.getElementById("view-status").innerText = data.status;

            document.getElementById("edit-fullname").value = data.fullname;
            document.getElementById("edit-email").value = data.email;
            document.getElementById("edit-role").value = data.role;
            document.getElementById("edit-status").value = data.status;
        }

        function enableEdit() {
            document.getElementById("view-mode").style.display = "none";
            document.getElementById("edit-mode").style.display = "block";
        }

        function cancelEdit() {
            document.getElementById("edit-mode").style.display = "none";
            document.getElementById("view-mode").style.display = "block";
        }

        async function saveAdmin() {
            const adminId = localStorage.getItem("adminid");

            const updated = {
                fullname: document.getElementById("edit-fullname").value,
                email: document.getElementById("edit-email").value,
                role: document.getElementById("edit-role").value,
                status: document.getElementById("edit-status").value
            };

            const { error } = await db.from("admin").update(updated).eq("adminid", adminId);

            if (error) return showModal("Lỗi", "Không thể lưu dữ liệu!");

            showModal("Thành công", "Đã cập nhật thông tin!");
            loadAdminInfo();
            cancelEdit();
        }

        loadHeader();
        loadAdminInfo();
    </script>

</body>
