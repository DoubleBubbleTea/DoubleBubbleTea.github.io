<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>Booking History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./admin_common.css">

  <style>
    .content {
      flex: 1;
      padding: 30px 50px;
      background: #f4f6fa;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    tr:hover {
      background: #eef3ff;
    }
  </style>
</head>

<div id="logout-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>Bạn muốn đăng xuất?</h3>
    <div style="margin-top: 15px;">
      <button class="btn-confirm" onclick="logout()">Đăng xuất</button>
      <button class="btn-cancel" onclick="closeLogoutModal()">Hủy</button>
    </div>
  </div>
</div>

<body>

  <div class="header">
    <div>Dashboard</div>
    <div class="header-right">

      <!-- NOTIFICATION ICON -->
      <div class="icon notification-icon" onclick="toggleNotification()">
        <img src="../img/notification_new.png" class="icon-img">
        <div id="notif-count" class="notif-count" style="display:none;">0</div>
      </div>

      <!-- LOGOUT ICON -->
      <div class="icon logout-icon" onclick="openLogoutModal()">
        <img src="../img/logout_new.png" class="icon-img">
      </div>

      <div id="header-user">Đang tải...</div>

      <!-- NOTIFICATION DROPDOWN -->
      <div id="notif-dropdown" class="notif-dropdown">
        <div class="notif-title">Thông báo</div>
        <div id="notif-list" class="notif-list">Không có thông báo!</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <!-- AVATAR BOX -->
      <div class="avatar-box">
        <img id="student-avatar" src="../img/logo.png" alt="avatar">
        <div class="avatar-name" id="avatar-fullname">—</div>
      </div>

      <a href="./dashboard.html">Thông tin quản trị</a>
      <a href="./load_student.html">Danh sách sinh viên</a>
      <a href="./load_history.html" class="active">Quản lý lịch sử đặt phòng</a>
      <a href="./load_notification.html">Quản lý thông báo</a>
      <a href="./load_facilities.html">Danh sách cơ sở vật chất</a>
      <a href="./load_room.html">Danh sách phòng</a>
      <a href="./load_seat.html">Danh sách chỗ ngồi</a>
      <a href="./load_feedback.html">Danh sách phản hồi</a>
      <a href="./load_violation.html">Danh sách vi phạm</a>
    </div>

    <div class="content">
      <h2>Quản lý lịch sử đặt phòng</h2>

      <div class="action-bar" style="margin-bottom:15px;">
        <select id="room-filter" onchange="filterHistory()">
          <option value="all">Hiển thị tất cả</option>
          <option value="I">Phòng đơn</option>
          <option value="G">Phòng nhóm</option>
        </select>
      </div>

      <div class="table-scroll">
        <table>
          <thead id="history-head"></thead>

          <tbody id="history-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin_common.js"></script>

  <script>
    let allHistory = [];

    function formatDate(dt) {
      if (!dt) return "—";
      return new Date(dt).toLocaleString("vi-VN");
    }

    async function loadHeader() {
      const adminId = localStorage.getItem("adminid");
      const { data } = await db.from("admin").select("fullname").eq("adminid", adminId).single();
      document.getElementById("header-user").innerText =
        data ? `Xin chào, ${data.fullname}` : "Không tìm thấy admin";
    }

    function renderRows(data, type) {
      const table = document.getElementById("history-table");
      table.innerHTML = "";

      data.forEach(row => {
        const startStr = formatDate(row.starttime);
        const endStr = formatDate(row.endtime);

        const bookingDate = startStr !== "—" ? startStr.split(" ")[1] : "—";
        const startTime = startStr !== "—" ? startStr.split(" ")[0] : "—";
        const endTime = endStr !== "—" ? endStr.split(" ")[0] : "—";

        let html = "";

        if (type === "I") {
          html = `
        <tr>
          <td>${row.bookingid}</td>
          <td>${row.studentid}</td>
          <td>${row.seatid || "—"}</td>
          <td><strong>${row.booking_status}</strong></td>
          <td>${bookingDate}</td>
          <td>${startTime}</td>
          <td>${endTime}</td>
        </tr>
      `;
        }
        else if (type === "G") {
          html = `
        <tr>
          <td>${row.bookingid}</td>
          <td>${row.studentid}</td>
          <td>${row.roomid}</td>
          <td>${row.facilities || "—"}</td>
          <td>${row.numbermember ?? "—"}</td>
          <td>${row.purpose || "—"}</td>
          <td><strong>${row.booking_status}</strong></td>
          <td>${bookingDate}</td>
          <td>${startTime}</td>
          <td>${endTime}</td>
        </tr>
      `;
        }
        else {
          html = `
        <tr>
          <td>${row.bookingid}</td>
          <td>${row.studentid}</td>
          <td>${row.roomid}</td>
          <td>${row.seatid || "—"}</td>
          <td>${row.facilities || "—"}</td>
          <td>${row.numbermember ?? "—"}</td>
          <td>${row.purpose || "—"}</td>
          <td>${formatDate(row.holdtime)}</td>
          <td><strong>${row.booking_status}</strong></td>
          <td>${bookingDate}</td>
          <td>${startTime}</td>
          <td>${endTime}</td>
        </tr>
      `;
        }

        table.insertAdjacentHTML("beforeend", html);
      });
    }

    function filterHistory() {
      const type = document.getElementById("room-filter").value;
      let filtered = allHistory;

      if (type === "I") {
        filtered = allHistory.filter(b => b.roomid?.startsWith("I"));
      }
      else if (type === "G") {
        filtered = allHistory.filter(b => b.roomid?.startsWith("G"));
      }

      renderHeader(type);
      renderRows(filtered, type);
    }


    function renderHeader(type) {
      const head = document.getElementById("history-head");

      if (type === "I") {
        head.innerHTML = `
      <tr>
        <th>Mã đặt phòng</th>
        <th>MSSV</th>
        <th>Mã chỗ ngồi</th>
        <th>Trạng thái đặt phòng</th>
        <th>Ngày đặt</th>
        <th>Thời gian bắt đầu</th>
        <th>Thời gian kết thúc</th>
      </tr>
    `;
      }
      else if (type === "G") {
        head.innerHTML = `
      <tr>
        <th>Mã đặt phòng</th>
        <th>MSSV</th>
        <th>Mã phòng</th>
        <th>Cơ sở vật chất</th>
        <th>Số lượng</th>
        <th>Mục đích</th>
        <th>Trạng thái đặt phòng</th>
        <th>Ngày đặt</th>
        <th>Thời gian bắt đầu</th>
        <th>Thời gian kết thúc</th>
      </tr>
    `;
      }
      else {
        head.innerHTML = `
      <tr>
        <th>Mã đặt phòng</th>
        <th>MSSV</th>
        <th>Mã phòng</th>
        <th>Mã chỗ ngồi</th>
        <th>Cơ sở vật chất</th>
        <th>Số lượng</th>
        <th>Mục đích</th>
        <th>Thời gian giữ chỗ</th>
        <th>Trạng thái đặt phòng</th>
        <th>Ngày đặt</th>
        <th>Thời gian bắt đầu</th>
        <th>Thời gian kết thúc</th>
      </tr>
    `;
      }
    }

    async function loadHistory() {
      const { data, error } = await db
        .from("booking")
        .select("*")
        .order("bookingid", { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      allHistory = data || [];
      filterHistory(); // render theo lựa chọn hiện tại
    }

    loadHeader();
    loadHistory();
  </script>

</body>

</html>
