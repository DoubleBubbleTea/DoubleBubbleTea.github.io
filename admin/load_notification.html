<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý thông báo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./admin_common.css">

    <style>
        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            padding: 30px 50px;
            background: #f4f6fa;
        }

        .content h2 {
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #003b73;
            color: white;
        }

        tr:hover {
            background: #eef3ff;
        }

        .btn-add {
            padding: 10px 18px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn-edit {
            background: #003b73;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            padding: 25px;
            width: 380px;
            border-radius: 6px;
        }

        .modal-input {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            margin-top: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-save {
            background: #16a34a;
            color: white;
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
        }
    </style>
</head>

<body>

    <!-- LOGOUT MODAL -->
    <div id="logout-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Bạn muốn đăng xuất?</h3>
            <div style="margin-top: 15px; display:flex; justify-content:center; gap:12px;">
                <button class="btn-confirm" onclick="logout()">Đăng xuất</button>
                <button class="btn-cancel" onclick="closeLogoutModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header">
        <div>Dashboard</div>
        <div class="header-right">

            <!-- NOTIFICATION ICON -->
            <div class="icon notification-icon" onclick="toggleNotification()">
                <img src="../img/notification_new.png" class="icon-img">
                <div id="notif-count" class="notif-count" style="display:none;">0</div>
            </div>

            <!-- LOGOUT ICON -->
            <div class="icon logout-icon" onclick="openLogoutModal()">
                <img src="../img/logout_new.png" class="icon-img">
            </div>

            <div id="header-user">Đang tải...</div>

            <!-- DROPDOWN -->
            <div id="notif-dropdown" class="notif-dropdown">
                <div class="notif-title">Thông báo</div>
                <div id="notif-list" class="notif-list">Không có thông báo!</div>
            </div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-logo">Logo</div>
            <div class="sidebar-title">Administrator</div>

            <a href="./dashboard.html">Thông tin cá nhân</a>
            <a href="./load_student.html">Danh sách sinh viên</a>
            <a href="./load_history.html">Lịch sử đặt phòng</a>
            <a href="./load_notification.html" class="active">Quản lý thông báo</a>
            <a href="./load_facilities.html">Danh sách cơ sở vật chất</a>
            <a href="./load_seat.html">Danh sách phòng</a>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <h2>Danh sách thông báo</h2>

            <button class="btn-add" onclick="openAddModal()">+ Thêm thông báo</button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nội dung</th>
                        <th>Admin</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="notif-table"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL ADD / EDIT -->
    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Thêm thông báo</h3>

            <textarea id="notif-message" class="modal-input" placeholder="Nhập nội dung thông báo" rows="4"></textarea>

            <div class="modal-buttons">
                <button class="btn-save" onclick="saveNotification()">Lưu</button>
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./admin_common.js"></script>

    <script>
        let editingId = null;

        function openAddModal() {
            editingId = null;
            document.getElementById("modal-title").innerText = "Thêm thông báo";
            document.getElementById("notif-message").value = "";
            document.getElementById("modal").style.display = "flex";
        }

        function openEditModal(item) {
            editingId = item.notification_id;
            document.getElementById("modal-title").innerText = "Sửa thông báo";
            document.getElementById("notif-message").value = item.message;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        async function saveNotification() {
            const adminId = localStorage.getItem("adminid");
            const msg = document.getElementById("notif-message").value;

            if (!msg.trim()) return alert("Vui lòng nhập nội dung!");

            const newData = { message: msg, adminid: adminId };

            if (editingId) {
                await db.from("notification").update(newData).eq("notification_id", editingId);
            } else {
                await db.from("notification").insert(newData);
            }

            closeModal();
            loadNotifications();
        }

        async function deleteNotification(id) {
            if (!confirm("Bạn có chắc muốn xóa?")) return;
            await db.from("notification").delete().eq("notification_id", id);
            loadNotifications();
        }

        async function loadNotifications() {
            const { data } = await db
                .from("notification")
                .select("notification_id, message, adminid");

            const table = document.getElementById("notif-table");
            table.innerHTML = "";

            data.forEach(n => {
                table.innerHTML += `
                    <tr>
                        <td>${n.notification_id}</td>
                        <td>${n.message}</td>
                        <td>${n.adminid ?? "—"}</td>

                        <td>
                            <button class="btn-edit" onclick='openEditModal(${JSON.stringify(n)})'>Sửa</button>
                            <button class="btn-delete" onclick="deleteNotification('${n.notification_id}')">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function loadHeader() {
            const adminId = localStorage.getItem("adminid");

            const { data } = await db
                .from("admin")
                .select("fullname")
                .eq("adminid", adminId)
                .single();

            document.getElementById("header-user").innerText =
                data ? `Xin chào, ${data.fullname}` : "";
        }

        loadHeader();
        loadNotifications();
    </script>

</body>

</html>
