<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USSH - Booking Login</title>

  <!-- CSS ngoài -->
  <link rel="stylesheet" href="./test.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<!-- MODAL POPUP -->
<div id="popupModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon">✔</div>
    <h3 id="modal-title">Completed</h3>
    <p id="modal-message">This is a message</p>

    <div class="modal-buttons">
      <button onclick="closeModal()" class="btn-close">OK</button>
    </div>
  </div>
</div>

<body>

  <!-- Ambient background -->
  <div class="area">
    <ul class="circles">
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
  </div>

  <!-- HEADER -->
  <header class="ussh-header">
    <div class="header-content">
      <div class="header-left">
        <img src="./img/VNUHCM_logo.svg.png" class="logo-vnu" alt="VNUHCM">
        <img src="./img/logo.png" class="logo-ussh" alt="USSH">
      </div>

      <div class="header-text">
        <h1>ĐẠI HỌC QUỐC GIA THÀNH PHỐ HỒ CHÍ MINH</h1>
        <h2>TRƯỜNG ĐẠI HỌC KHOA HỌC XÃ HỘI VÀ NHÂN VĂN</h2>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div class="content fade-in-up">

    <div class="content-wrapper">
      <h1>Welcome to USSH</h1>

      <!-- LOGIN -->
      <div class="login-card">
        <h2>Login</h2>
        <div class="form-group">
          <input id="email" type="email" class="input-box" placeholder="Email">
        </div>

        <div class="form-group">
          <input id="password" type="password" class="input-box" placeholder="Password">
        </div>

        <button onclick="login()">Login</button>
        <div class="after-login-space"></div>

        <!-- REGISTER -->
        <h2>Register</h2>

        <div class="form-group">
          <input id="r_student_id" type="number" class="input-box" placeholder="Student ID (132184)">
        </div>

        <div class="form-group">
          <input id="r_name" type="text" class="input-box" placeholder="Full Name">
        </div>

        <div class="form-group">
          <input id="r_email" type="email" class="input-box" placeholder="Email">
        </div>

        <!-- GENDER -->
        <div class="form-group">
          <label><b>GENDER</b></label>
          <div class="gender-group">
            <div class="gender-btn" data-value="Male">Male</div>
            <div class="gender-btn" data-value="Female">Female</div>
            <div class="gender-btn" data-value="Others">Others</div>
          </div>
        </div>

        <!-- DOB -->
        <div class="form-group">
          <label><b>DAY OF BIRTH </b></label>
          <input id="r_dob" type="date" class="input-box" placeholder="Date of Birth">
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label><b>PASSWORD</b></label><br>
          <div class="input-wrapper">
            <input id="r_password" type="password" class="input-box" placeholder="Password">
            <span class="toggle-eye" onclick="togglePassword('r_password', this)">👁️</span>
          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label><b>REPEAT YOUR PASSWORD</b></label><br>
          <div class="input-wrapper">
            <input id="r_confirm" type="password" class="input-box" placeholder="Repeat Password"
              oninput="checkPasswordMatch()">
            <span id="pwd_error" class="error-icon">✖</span>
            <span class="toggle-eye" onclick="togglePassword('r_confirm', this)">👁️</span>
          </div>
        </div>

        <button onclick="register()">Register</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer fade-in">
    © 2025 - USSH VNUHCM
  </div>

  <!-- JAVASCRIPT Supabase + Function -->
  <script>
    const db = supabase.createClient(
      "https://oxaimnemcnqudtdguoyk.supabase.co",
      "sb_publishable_6p-lVAZg_ATPz1a1cDjlOg_9vIcR42c"
    );

    let selectedGender = null;
    document.querySelectorAll(".gender-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedGender = btn.dataset.value;
      });
    });

    function checkPasswordMatch() {
      const pwd = document.getElementById("r_password").value;
      const conf = document.getElementById("r_confirm").value;
      document.getElementById("pwd_error").style.display = (pwd !== conf && conf !== "") ? "inline" : "none";
    }

    function togglePassword(id, eyeIcon) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      eyeIcon.textContent = input.type === "password" ? "👁️" : "🙈";
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // ===== 🟦 KIỂM TRA ADMIN TRƯỚC =====
      if (email === "admin@gmail.com") {

        const { data: adminData } = await db
          .from("students")
          .select("*")
          .eq("email", email)
          .eq("password", password)
          .limit(1);

        if (adminData.length === 0) {
          showPopup("Admin Login Failed", "Wrong admin password!");
          return;
        }

        // -----> Admin đăng nhập thành công
        showPopup("Welcome Admin!", "Redirecting to dashboard...");

        setTimeout(() => {
          window.location.href = "./dashboard.html";
        }, 1500);

        return; // Dừng ở đây, không kiểm tra login student nữa
      }

      // ===== 🟩 LOGIN STUDENT BÌNH THƯỜNG =====
      const { data } = await db
        .from("students")
        .select("*")
        .eq("email", email)
        .eq("password", password)
        .limit(1);

      if (data.length === 0) {
        showPopup("Login Failed", "Wrong email or password!");
      } else {
        showPopup("Login Success", "Welcome back!");

        setTimeout(() => {
          window.location.href = "./realtimebooking.html";
        }, 1500);
      }
    }


    async function register() {
      const student_id = parseInt(document.getElementById("r_student_id").value);
      const name = document.getElementById("r_name").value;
      const email = document.getElementById("r_email").value;
      const dob = document.getElementById("r_dob").value;
      const password = document.getElementById("r_password").value;
      const confirm = document.getElementById("r_confirm").value;

      if (!selectedGender) return showPopup("Error", "Please select gender!");
      if (password !== confirm) return showPopup("Error", "Passwords do not match!");

      let { data: exists } = await db
        .from("students")
        .select("*")
        .or(`email.eq.${email},student_id.eq.${student_id}`);

      if (exists.length) return showPopup("Error", "Student already exists!");

      await db.from("students").insert([
        { student_id, name, email, gender: selectedGender, dob, password }
      ]);

      showPopup("Completed", "Your account has been created!");
    }


    function showPopup(title, message) {
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-message").innerText = message;

      document.getElementById("popupModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("popupModal").style.display = "none";
    }
  </script>
</body>

</html>
